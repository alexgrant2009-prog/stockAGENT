[project]
name = "marketscout"
version = "0.1.0"
description = "Stock market analysis CLI with tracked recommendations and a paper portfolio"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.0",
    "click>=8.1",
]

[project.scripts]
marketscout = "marketscout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marketscout"]
